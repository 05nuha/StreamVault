<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StreamVault - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <h1>StreamVault</h1>
    <h2>Login</h2>

    <!-- show error if login failed -->
    <p id="error-msg" style="color: red; display: none;">Invalid email or password. Please try again.</p>

    <!-- show success message after registering -->
    <p id="success-msg" style="color: green; display: none;">Account created! You can now log in.</p>

    <form action="login" method="POST">
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter email" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter password" minlength="8" required>
        </div>
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="register.html">Register</a></p>
</div>

<script>
    // check url params to show messages
    let params = new URLSearchParams(window.location.search);
    if (params.get('error') == '1') {
        document.getElementById('error-msg').style.display = 'block';
    }
    if (params.get('registered') == '1') {
        document.getElementById('success-msg').style.display = 'block';
    }
</script>

</body>
</html>
