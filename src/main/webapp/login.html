<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StreamVault - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="background">
    <div class="streaming-card">

        <h1>StreamVault</h1>
        <h2>Sign in to continue</h2>

        <!-- show error if login failed -->
        <div id="error-msg" class="msg-error">Invalid email or password. Please try again.</div>

        <!-- show success message after registering -->
        <div id="success-msg" class="msg-success">Account created! You can now log in.</div>

        <form action="login" method="POST">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min. 8 characters" minlength="8" required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <p>Don't have an account? <a href="register.html">Create one</a></p>

    </div>
</div>

<script>
    // check url params to show messages
    let params = new URLSearchParams(window.location.search);
    if (params.get('error') == '1') {
        document.getElementById('error-msg').style.display = 'block';
    }
    if (params.get('registered') == '1') {
        document.getElementById('success-msg').style.display = 'block';
    }
</script>

</body>
</html>
