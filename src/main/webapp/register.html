<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StreamVault - Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <h1>StreamVault</h1>
    <h2>Create Account</h2>

    <!-- show error message if something went wrong -->
    <p id="error-msg" style="color: red; display: none;">Something went wrong. Please try again.</p>

    <form action="register" method="POST">
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
            <label>Password:</label>
            <!-- password must be at least 8 characters -->
            <input type="password" name="password" placeholder="Minimum 8 characters" minlength="8" required>
        </div>
        <div class="form-group">
            <label>Country:</label>
            <input type="text" name="country" placeholder="Enter your country" required>
        </div>
        <div class="form-group">
            <label>Subscription Plan:</label>
            <select name="plan" required>
                <option value="">-- Select a plan --</option>
                <option value="1">Basic - $7.99/month</option>
                <option value="2">Standard - $13.99/month</option>
                <option value="3">Premium - $17.99/month</option>
            </select>
        </div>
        <button type="submit">Register</button>
    </form>

    <p>Already have an account? <a href="login.html">Login here</a></p>
</div>

<script>
    let params = new URLSearchParams(window.location.search);
    if (params.get('error') == '1') {
        document.getElementById('error-msg').style.display = 'block';
    }
</script>

</body>
</html>
