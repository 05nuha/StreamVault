<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — StreamVault</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="background">
    <div class="streaming-card">

        <h1>StreamVault</h1>
        <h2>Create your account</h2>

        <!-- show error message if something went wrong -->
        <div id="error-msg" class="msg-error">Something went wrong. Please try again.</div>

        <form action="register" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <!-- password must be at least 8 characters -->
                <input type="password" name="password" placeholder="Min. 8 characters" minlength="8" required>
            </div>
            <div class="form-group">
                <label>Country</label>
                <input type="text" name="country" placeholder="e.g. UAE" required>
            </div>
            <div class="form-group">
                <label>Subscription Plan</label>
                <select name="plan" required>
                    <option value="">-- Select a plan --</option>
                    <option value="1">Basic — $7.99/month</option>
                    <option value="2">Standard — $13.99/month</option>
                    <option value="3">Premium — $17.99/month</option>
                </select>
            </div>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p>Already have an account? <a href="login.html">Sign in</a></p>

    </div>
</div>

<script>
    let params = new URLSearchParams(window.location.search);
    if (params.get('error') == '1') {
        document.getElementById('error-msg').style.display = 'block';
    }
</script>

</body>
</html>
